[platformio]
default_envs = esp32dev
data_dir = data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
board_build.partitions = partitions_ota_4mb.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAPP_VERSION=\"0.1.0\"
lib_deps =
    adafruit/Adafruit AHTX0
    bogde/HX711
    olikraus/U8g2
    madhephaestus/ESP32Encoder
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson @ ^6.21.5

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<control/PidController.cpp>
    +<control/HumidityMath.cpp>
    +<core/DryingStateMachine.cpp>
build_flags =
    -std=c++17
