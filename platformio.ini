[platformio]
default_envs = esp32dev
data_dir = data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
board_build.partitions = partitions_ota_4mb.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAPP_VERSION=\"0.2.1\"
lib_deps =
    adafruit/Adafruit AHTX0
    bogde/HX711
    olikraus/U8g2
    madhephaestus/ESP32Encoder
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson @ ^6.21.5

# Over-the-air flashing: ArduinoOTA over Wi-Fi, no USB cable needed.
#   pio run -e esp32dev_ota -t upload
# Override the target with --upload-port 192.168.1.238 when mDNS is blocked.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = dryer.local

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<config/AppConfig.cpp>
    +<control/AhSlopeEstimator.cpp>
    +<control/HeaterThermostat.cpp>
    +<control/PidController.cpp>
    +<control/HumidityMath.cpp>
    +<control/PurgeScheduler.cpp>
    +<core/DryingStateMachine.cpp>
    +<services/ActuatorService.cpp>
    +<services/ControlService.cpp>
    +<services/SafetyService.cpp>
build_flags =
    -std=c++17

[env:esp32dev_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DIDRYER_DISABLE_NTC_SAFETY
